<!DOCTYPE html>
<html lang="en">

<head>
  <script>!function () {var m = location.pathname.match(/^(\/local1*-[^/]+\/)/); document.write('<base href="' + (m ? m[1] : '/') + '">')}()</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>MakeCargo – Freight Forwarding Software</title>
  <meta name="description"
    content="MakeCargo is an all-in-one freight forwarding platform for managing shipments, quotes, accounting, carrier tracking, and customer relationships." />

  <!-- Favicons -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#ffffff" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="MakeCargo – Freight Forwarding Software" />
  <meta property="og:description"
    content="MakeCargo is an all-in-one freight forwarding platform for managing shipments, quotes, accounting, carrier tracking, and customer relationships." />
  <meta property="og:image" content="/android-chrome-512x512.png" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="MakeCargo – Freight Forwarding Software" />
  <meta name="twitter:description"
    content="MakeCargo is an all-in-one freight forwarding platform for managing shipments, quotes, accounting, carrier tracking, and customer relationships." />

  <link rel="stylesheet" type="text/css" href="/loader.css" />
</head>

<body>
  <div id="app">
    <div id="loading-bg">
      <div class="loading-logo">

      </div>
      <div class=" loading">
        <div class="effect-1 effects"></div>
        <div class="effect-2 effects"></div>
        <div class="effect-3 effects"></div>
      </div>
    </div>
  </div>
  <script type="module" src="./src/main.js"></script>
  <script>
    const loaderColor = localStorage.getItem('vuexy-initial-loader-bg') || '#FFFFFF'
    const primaryColor = localStorage.getItem('vuexy-initial-loader-color') || '#7367F0'

    if (loaderColor)
      document.documentElement.style.setProperty('--initial-loader-bg', loaderColor)

    if (primaryColor)
      document.documentElement.style.setProperty('--initial-loader-color', primaryColor)
  </script>
</body>

</html>
